<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodance Creator Tracker</title>
<style>
:root{--bg:#1a1b1e;--s1:#222428;--s2:#2b2d31;--s3:#35373c;--bd:#3f4147;--tx:#e0e0e6;--dim:#8b8d94;--ac:#5865f2;--ach:#4752c4;--gn:#23a559;--gnb:rgba(35,165,89,.12);--yw:#f0b232;--ywb:rgba(240,178,50,.12);--rd:#da373c;--rdb:rgba(218,55,60,.12);--or:#e67e22;--orb:rgba(230,126,34,.12);--pk:#eb459e;--pkb:rgba(235,69,158,.12);--cy:#00b4d8;--cyb:rgba(0,180,216,.12);--pp:#9b59b6;--ppb:rgba(155,89,182,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:12px}
.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px}
.hdr h1{font-size:15px;font-weight:700}.hdr h1 span{color:var(--ac)}
.hdr-acts{display:flex;gap:5px;align-items:center}
.tabs{display:flex;background:var(--s1);border-bottom:2px solid var(--bd);padding:0 16px;overflow-x:auto}
.tab{padding:9px 14px;cursor:pointer;font-size:11px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;user-select:none;white-space:nowrap}
.tab:hover{color:var(--tx);background:var(--s2)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab .bdg{background:var(--rd);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:3px;font-weight:700}
.cnt{padding:14px;max-width:1600px;margin:0 auto}.pnl{display:none}.pnl.on{display:block}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:12px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:8px;text-align:center}
.kpi .val{font-size:16px;font-weight:700}.kpi .lbl{font-size:8px;color:var(--dim);margin-top:1px;text-transform:uppercase}
/* TRACKER */
.trk-top{display:flex;gap:6px;margin-bottom:6px;align-items:center;flex-wrap:wrap}
.si{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;color:var(--tx);font-size:12px}
.si:focus{outline:none;border-color:var(--ac)}
.fb{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:4px 7px;color:var(--dim);font-size:10px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.fb:hover{background:var(--s3);color:var(--tx)}.fb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
/* TABLE */
.tw{overflow-x:auto;border-radius:7px;border:1px solid var(--bd);max-height:60vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--s2);padding:6px 6px;text-align:left;font-size:9px;text-transform:uppercase;color:var(--dim);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--tx)}
/* Excel-style column filter dropdown */
.th-wrap{display:flex;align-items:center;gap:3px;position:relative}
.col-dd-btn{background:none;border:none;color:var(--dim);cursor:pointer;font-size:8px;padding:1px 2px;border-radius:2px;line-height:1}
.col-dd-btn:hover{background:var(--s3);color:var(--tx)}
.col-dropdown{position:absolute;top:100%;left:0;background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:6px;z-index:100;min-width:140px;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none}
.col-dropdown.show{display:block}
.col-dd-item{display:flex;align-items:center;gap:5px;padding:3px 4px;font-size:10px;cursor:pointer;border-radius:3px;white-space:nowrap}
.col-dd-item:hover{background:var(--s2)}.col-dd-item input{accent-color:var(--ac);width:11px;height:11px}
.col-dd-divider{border-top:1px solid var(--bd);margin:3px 0}
.col-dd-label{font-size:9px;color:var(--dim);padding:2px 4px;font-weight:600}
td{padding:4px 6px;border-bottom:1px solid var(--bd);vertical-align:middle}
tr:hover td{background:rgba(88,101,242,.04)}
.h-cell{white-space:nowrap}.h-cell a{color:var(--ac);text-decoration:none;font-weight:600}.h-cell a:hover{text-decoration:underline}
.uname{color:var(--pp);font-size:9px;margin-left:3px}
.g-cell{font-weight:700;white-space:nowrap}.g-cell.has{color:var(--gn)}.g-cell.no{color:var(--dim)}
.d-up{color:var(--gn);font-size:9px}.d-dn{color:var(--rd);font-size:9px}.d-flat{color:var(--dim);font-size:9px}
.cc{text-align:center}.cc input[type=checkbox]{width:13px;height:13px;cursor:pointer;accent-color:var(--ac)}
.tb{display:inline-block;padding:1px 5px;border-radius:3px;font-size:8px;font-weight:700}
.t-new{background:var(--cyb);color:var(--cy)}.t-act{background:var(--gnb);color:var(--gn)}.t-vip{background:var(--ywb);color:var(--yw)}.t-vvip{background:var(--pkb);color:var(--pk)}.t-none{background:var(--s3);color:var(--dim)}
.tier-up{background:rgba(235,69,158,.2);color:var(--pk);font-size:7px;padding:1px 3px;border-radius:3px;margin-left:2px;font-weight:700;vertical-align:middle}
.ag-badge{display:inline-block;font-size:7px;padding:1px 3px;border-radius:2px;background:var(--orb);color:var(--or);font-weight:700;margin-left:2px}
.ni{background:transparent;border:1px solid transparent;border-radius:3px;padding:2px 4px;color:var(--tx);font-size:10px;width:75px}
.ni:focus{border-color:var(--ac);outline:none;background:var(--s2)}
.ni-email{width:120px}
.tag{display:inline-block;font-size:7px;padding:1px 3px;border-radius:2px;margin-left:2px;font-weight:700}
/* SEGMENTS */
.sg-section{margin-bottom:16px}
.sg-section-hdr{font-size:10px;font-weight:700;color:var(--dim);padding:5px 8px;border-radius:5px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;background:var(--s2);border:1px solid var(--bd)}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:6px;overflow:hidden}
.sh{padding:8px 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.sh h3{font-size:11px;display:flex;align-items:center;gap:4px}
.sh .ct{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:700}
.sb{padding:0 10px 10px;max-height:200px;overflow-y:auto}.sb.hide{display:none}
.sb p.desc{font-size:9px;color:var(--dim);margin-bottom:4px}
.si-item{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);font-size:10px}
.si-item:last-child{border-bottom:none}.si-item .hnd{font-weight:600}.si-item .mt{color:var(--dim);font-size:9px;text-align:right}
/* BUTTONS */
.btn{border:none;border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ach)}
.btn-s{background:var(--s3);color:var(--tx);border:1px solid var(--bd)}.btn-s:hover{background:var(--s2)}
.btn-d{background:var(--rd);color:#fff}
.snap-box{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:11px;margin-bottom:11px}
.snap-box h4{font-size:11px;color:var(--dim);margin-bottom:4px}
.toast{position:fixed;bottom:14px;right:14px;background:var(--gn);color:#fff;padding:8px 14px;border-radius:6px;font-size:11px;font-weight:600;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none;z-index:9999}
.toast.show{opacity:1;transform:translateY(0)}
/* DISCORD */
.disc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.disc-box{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:12px}
.disc-box h4{font-size:11px;margin-bottom:5px}
.disc-box p.hint{font-size:10px;color:var(--dim);margin-bottom:6px;line-height:1.4}
.disc-ta{width:100%;height:80px;background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:7px;color:var(--tx);font-size:11px;font-family:monospace;resize:vertical}
.disc-ta:focus{outline:none;border-color:var(--ac)}
.disc-result{margin-top:5px;max-height:120px;overflow-y:auto;font-size:10px}
.match{color:var(--gn);padding:1px 0}.nomatch{color:var(--rd);padding:1px 0}.fuzzy{color:var(--yw);padding:1px 0}
.map-table{width:100%;font-size:10px;border-collapse:collapse;margin-top:4px}
.map-table td,.map-table th{padding:3px 5px;border-bottom:1px solid var(--bd);text-align:left}
.map-table th{font-size:8px;text-transform:uppercase;color:var(--dim)}
.disc-stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:11px}
.ds-card{background:var(--s1);border:1px solid var(--bd);border-radius:6px;padding:7px;text-align:center}
.ds-card .val{font-size:15px;font-weight:700}.ds-card .lbl{font-size:8px;color:var(--dim);margin-top:1px}
/* UPLOAD */
.up-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.up-card{background:var(--s1);border:1px solid var(--bd);border-radius:7px;padding:12px}
.up-card h4{font-size:11px;color:var(--dim);margin-bottom:6px}
.up-zone{border:2px dashed var(--bd);border-radius:6px;padding:20px 8px;text-align:center;cursor:pointer;transition:.2s;background:var(--s2)}
.up-zone:hover,.up-zone.over{border-color:var(--ac);background:rgba(88,101,242,.05)}
.up-zone h3{font-size:12px;margin-bottom:2px}.up-zone p{font-size:10px;color:var(--dim)}
.up-status{margin-top:4px;font-size:11px;font-weight:600}
.up-status.ok{color:var(--gn)}.up-status.no{color:var(--dim)}
/* HISTORY */
.hist-wrap{overflow:auto;border:1px solid var(--bd);border-radius:6px;max-height:520px}
.hist-tbl{width:100%;border-collapse:collapse;font-size:10px}
.hist-tbl th{background:var(--s2);padding:4px 6px;text-align:center;color:var(--dim);font-size:8px;text-transform:uppercase;position:sticky;top:0;white-space:nowrap;border-bottom:1px solid var(--bd)}
.hist-tbl th:first-child{text-align:left;position:sticky;left:0;z-index:3;min-width:160px}
.hist-tbl td{padding:3px 6px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
.hist-tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--s1);z-index:1;font-size:10px}
.hist-tbl tr:hover td{background:rgba(88,101,242,.04)}
.hist-tbl tr:hover td:first-child{background:var(--s2)}
@media(max-width:900px){.sg,.disc-grid,.up-row{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

}

var ctrlDone=false;
function prevDay(){
  var dates=Object.keys(hist).sort();
  var t=today();
  // Find most recent date strictly before today
  for(var i=dates.length-1;i>=0;i--){
    if(dates[i]<t)return dates[i];
  }
  // If no previous date, use earliest available (for delta display)
  if(dates.length>=2)return dates[dates.length-2];
  return null;
}

function autoSave(){

  setSt('...','var(--yw)');
  if(_st)clearTimeout(_st);
  _st=setTimeout(function(){
    if(_saving)return;
    _saving=true;
    var payload=JSON.stringify(buildState());
    fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:payload})
      .then(function(r){
        _saving=false;
        return r.json();
      })
      .then(function(d){
        var t=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
        setSt(t+' 저장됨','var(--gn)');

      .catch(function(e){
        _saving=false;

            .then(function(r){return r.json()})
            .then(function(){setSt('재시도 저장됨','var(--gn)')})

}

  function renderSegCard(seg){
    var collapsed=seg.items.length===0;
    var h='<div class="sc">';
    h+='<div class="sh" style="background:'+seg.bg+'" onclick="var b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\'">';
    h+='<h3>'+seg.icon+' '+seg.title+'</h3>';
    h+='<span class="ct" style="background:'+seg.color+';color:#fff">'+seg.items.length+'</span>';
    h+='</div>';
    h+='<div style="'+(collapsed?'display:none':'')+'padding:0 12px 10px;max-height:220px;overflow-y:auto">';
    if(seg.desc)h+='<p style="font-size:9px;color:var(--dim);margin:6px 0 4px">'+seg.desc+'</p>';
    if(!seg.items.length){
      h+='<p style="font-size:10px;color:var(--dim);text-align:center;padding:8px">해당없음</p>';
    } else {
      seg.items.slice(0,40).forEach(function(cr){
        var mt=fmt(cr.g);
        var dg=getDelta(cr.h,'g'),dv=getDelta(cr.h,'v');
        if(dg>0)mt+=' <b style="color:var(--gn)">+'+fmt(dg)+'</b>';
        mt+=' · '+cr.v+'개';
        if(dv>0)mt+=' <b style="color:var(--gn)">+'+dv+'</b>';
        if(cr.uname)mt+=' <span style="font-size:8px;color:#888;font-style:italic">'+cr.uname+'</span>';
        if(cr.email)mt+=' <span style="font-size:8px;color:var(--ac)">✉</span>';
        h+='<div class="si-item">';
        h+='<span class="hnd">@'+cr.h+(cr.ag?'<span class="ag-badge">AG</span>':'')+'</span>';
        h+='<span class="mt">'+mt+'</span>';
        h+='</div>';
      });
    }
    h+='</div></div>';
    return h;
  }
    function renderGrp(grp,title,list){
    var h='<div class="sg-section"><div class="sg-section-hdr">'+title+'</div><div class="sg">';
    list.filter(function(s){return s.grp===grp}).forEach(function(seg){
      h+='<div class="sc"><div class="sh" style="background:'+seg.bg+'" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><h3>'+seg.icon+' '+seg.title+'</h3><span class="ct" style="background:'+seg.color+';color:#fff">'+seg.items.length+'</span></div>';
      h+='<div class="sb'+(seg.items.length===0?' hide':'')+'"><p class="desc">'+(seg.desc||'')+'</p>';
      if(!seg.items.length)h+='<p style="font-size:10px;color:var(--dim);text-align:center;padding:8px">-</p>';
      else seg.items.slice(0,40).forEach(function(c){
        var mt=fmt(c.g);var dg=getDelta(c.h,'g'),dv=getDelta(c.h,'v');
        if(dg>0)mt+=' <span style="color:var(--gn)">+'+fmt(dg)+'</span>';mt+=' &#xB7; '+c.v+'V';if(dv>0)mt+=' <span style="color:var(--gn)">+'+dv+'</span>';
        if(c.uname)mt+='<br><span style="font-size:8px;color:#aaa;font-style:italic">DC:'+c.uname+'</span>';
        h+='<div class="si-item"><span class="hnd">@'+c.h+(c.ag?'<span class="ag-badge">AG</span>':'')+'</span><span class="mt">'+mt+'</span></div>'});
      h+='</div></div>'});
    h+='</div></div>';return h;}

  $('segA').innerHTML=
    renderGrp('common','&#x1F310; &#xACF5;&#xD1B5;',segs)+
    renderGrp('new','&#x1F331; New Creator',segs)+
    renderGrp('active','&#x1F45F; Active Creator',segs)+
    renderGrp('vip','&#x2B50; VIP Creator',segs);
}

// ===== HISTORY =====
function renderHist(){
  var dates=Object.keys(hist).sort();if(!dates.length){$('histA').innerHTML='<div class="snap-box"><p style="color:var(--dim)">CSV &#xC5C5;&#xB85C;&#xB4DC; &#xD6C4; &#xC0DD;&#xC131;&#xB429;&#xB2C8;&#xB2E4;</p></div>';return}
  var allH=new Set();dates.forEach(function(d){Object.keys(hist[d]).forEach(function(h){if(hist[d][h].g>0||hist[d][h].v>0)allH.add(h)})});
  var handles=Array.from(allH).filter(function(h){return C[h]}).sort(function(a,b){return(C[b]?C[b].g:0)-(C[a]?C[a].g:0)});
  var h='<div class="snap-box" style="padding:8px"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">'+
    '<h4 style="color:var(--tx)">&#x1F4C5; &#xB0A0;&#xC9DC;&#xBCC4; GMV + &#xC601;&#xC0C1;&#xC218;</h4>'+
    '<div style="font-size:9px;color:var(--dim)">&#xB179;&#xC0C9;&#x2191; &#xC0C1;&#xC2B9; | &#xBE68;&#xAC04;&#x2193; &#xD558;&#xB77D;</div></div>'+
    '<div class="hist-wrap"><table class="hist-tbl"><thead><tr><th>Handle</th>';
  dates.forEach(function(d){h+='<th colspan="2" style="text-align:center;border-left:1px solid var(--bd)">'+d.slice(5)+'</th>'});
  h+='</tr><tr><th></th>';dates.forEach(function(){h+='<th style="color:var(--gn)">GMV</th><th style="color:var(--cy);border-right:1px solid var(--bd)">V</th>'});
  h+='</tr></thead><tbody>';
  handles.forEach(function(handle){
    var c=C[handle];var tc=c?c.tier:'none';
    var tColor=tc==='vvip'?'var(--pk)':tc==='vip'?'var(--yw)':tc==='active'?'var(--gn)':'var(--cy)';
    h+='<tr><td style="border-left:3px solid '+tColor+'">'+
      '<a href="https://www.tiktok.com/@'+handle+'" target="_blank" style="color:var(--ac);text-decoration:none;font-weight:600">@'+handle+'</a>';
    if(c&&c.uname)h+='<br><span style="font-size:8px;color:var(--pp)">'+c.uname+'</span>';
    if(c&&c.ag)h+='<span class="ag-badge">AG</span>';h+='</td>';
    dates.forEach(function(d,i){
      var cur=hist[d]&&hist[d][handle]?hist[d][handle]:{g:0,v:0};
      var prev=i>0&&hist[dates[i-1]]&&hist[dates[i-1]][handle]?hist[dates[i-1]][handle]:{g:0,v:0};
      var dg=cur.g-prev.g,dv=cur.v-prev.v;
      h+='<td style="border-left:1px solid var(--bd);color:'+(i>0&&dg>0?'var(--gn)':i>0&&dg<0?'var(--rd)':'inherit')+'">'+fmt(cur.g);
      if(i>0&&dg!==0)h+='<br><span style="font-size:8px">'+(dg>0?'+':'')+fmt(dg)+'</span>';h+='</td>';
      h+='<td style="border-right:1px solid var(--bd)">'+cur.v;
      if(i>0&&dv!==0)h+='<br><span style="font-size:8px;color:'+(dv>0?'var(--gn)':'var(--rd)')+'"> '+(dv>0?'+':'')+dv+'</span>';h+='</td>'});
    h+='</tr>'});
  h+='</tbody></table></div></div>';$('histA').innerHTML=h;}

// ===== DISCORD =====
function renderDisc(){var a=Object.values(C);var djC=a.filter(function(c){return c.dj}).length;
  var chN=a.filter(function(c){return c.cn}).length,chA=a.filter(function(c){return c.ca}).length,chV=a.filter(function(c){return c.cv}).length;
  $('discA').innerHTML='<div class="disc-stat"><div class="ds-card"><div class="val" style="color:var(--ac)">'+djC+'</div><div class="lbl">Discord</div></div><div class="ds-card"><div class="val" style="color:var(--cy)">'+chN+'</div><div class="lbl">&#x1F331;Ch</div></div><div class="ds-card"><div class="val" style="color:var(--gn)">'+chA+'</div><div class="lbl">&#x1F45F;Ch</div></div><div class="ds-card"><div class="val" style="color:var(--yw)">'+chV+'</div><div class="lbl">&#x2B50;Ch</div></div></div>'+
  '<div class="disc-grid"><div><div class="disc-box"><h4>&#x1F4CB; &#xC77C;&#xAD04; Discord</h4><textarea class="disc-ta" id="bulkH" placeholder="TikTok&#xD578;&#xB4E4; &#xB610;&#xB294; Discord&#xBA85;"></textarea><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-p" onclick="bm(\'dj\',true,\'bulkH\',\'bR\')">&#x2713; DC</button><button class="btn btn-s" onclick="bm(\'dj\',false,\'bulkH\',\'bR\')">&#x2715;</button></div><div class="disc-result" id="bR"></div></div>'+
  '<div class="disc-box" style="margin-top:10px"><h4>&#x1F4DE; &#xC5F0;&#xB77D;/&#xC751;&#xB2F5;</h4><textarea class="disc-ta" id="bulkC" style="height:60px"></textarea><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-p" onclick="bm(\'ct\',true,\'bulkC\',\'cR\')">&#xC5F0;&#xB77D;</button><button class="btn btn-p" onclick="bm(\'rp\',true,\'bulkC\',\'cR\')">&#xC751;&#xB2F5;</button></div><div class="disc-result" id="cR"></div></div></div>'+
  '<div><div class="disc-box"><h4>&#x1F517; &#xB2C9;&#xB124;&#xC784; &#xB9E4;&#xD551;</h4><div style="display:flex;gap:4px;margin-bottom:4px"><input class="si" id="mDN" placeholder="Discord&#xBA85;" style="width:44%"><input class="si" id="mTT" placeholder="TikTok&#xD578;&#xB4E4;" style="width:44%"><button class="btn btn-p" onclick="addM()" style="padding:5px 8px">+</button></div><div id="mL"></div></div>'+
  '<div class="disc-box" style="margin-top:10px"><h4>&#x1F4E5; &#xBA64;&#xBC84; &#xBAA9;&#xB85D; &#xB9E4;&#xCE6D;</h4><textarea class="disc-ta" id="dMem" style="height:70px" placeholder="Discord &#xBA64;&#xBC14;&#xB9AC; (&#xD55C; &#xC904;)"></textarea><button class="btn btn-p" style="margin-top:4px" onclick="mDisc()">&#x1F50D;</button><div class="disc-result" id="dMR"></div></div></div></div>';rML()}
function bm(field,val,taId,resId){var text=$(taId).value.trim();if(!text)return;var hs=text.split('\n').map(function(h){return h.trim().toLowerCase().replace(/^@/,'')}).filter(Boolean);
  var ok=0,bad=[];hs.forEach(function(h){var target=C[h]?h:(discMap[h]||null);if(target&&C[target]){C[target][field]=val;ok++}else bad.push(h)});
  $(resId).innerHTML='<p style="color:var(--gn)">&#x2705;'+ok+'</p>'+(bad.length?'<p style="color:var(--rd)">&#x274C;'+bad.join(', ')+'</p>':'');render()}
function addM(){var dn=$('mDN').value.trim(),tt=$('mTT').value.trim().toLowerCase().replace(/^@/,'');if(!dn||!tt)return;if(!C[tt]){toast('@'+tt+' &#xC5C6;&#xC74C;');return}discMap[dn.toLowerCase()]=tt;$('mDN').value='';$('mTT').value='';rML();toast(dn+'&#x2192;@'+tt)}
function delM(k){delete discMap[k];rML()}
function rML(){var el=$('mL');if(!el)return;var e=Object.entries(discMap).slice(0,15);if(!e.length){el.innerHTML='<p style="font-size:10px;color:var(--dim)">-</p>';return}
  var h='<table class="map-table"><thead><tr><th>Discord</th><th>TikTok</th><th></th></tr></thead><tbody>';
  e.forEach(function(p){h+='<tr><td>'+p[0]+'</td><td>@'+p[1]+'</td><td><button class="btn btn-d" style="padding:1px 4px;font-size:8px" onclick="delM(\''+p[0].replace(/'/g,"\\'")+'\')">x</button></td></tr>'});
  h+='</tbody></table>';el.innerHTML=h}
function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[];for(var j=0;j<=n;j++)d[i][j]=0;d[i][0]=i}for(var j=0;j<=n;j++)d[0][j]=j;for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));return d[m][n]}
function mDisc(){var text=$('dMem').value.trim();if(!text)return;var mems=text.split('\n').map(function(m){return m.trim()}).filter(Boolean);var ks=Object.keys(C);var exact=[],fuzzy=[],none=[];
  mems.forEach(function(m){var ml=m.toLowerCase().replace(/^@/,'');if(C[ml]){C[ml].dj=true;exact.push(ml);return}if(discMap[ml]&&C[discMap[ml]]){C[discMap[ml]].dj=true;exact.push(ml+'&#x2192;'+discMap[ml]);return}
  var cands=ks.filter(function(h){return(ml.length>=4&&h.indexOf(ml)>=0)||(ml.length>=4&&ml.indexOf(h)>=0)||(lev(ml,h)<=2&&ml.length>=4)});if(cands.length)fuzzy.push({d:m,c:cands});else none.push(m)});
  var h='<p style="font-weight:600;font-size:10px">'+exact.length+'/'+mems.length+'</p>';
  if(fuzzy.length){h+='<details open><summary style="cursor:pointer;color:var(--yw);font-size:10px">&#x1F7E1;'+fuzzy.length+'</summary>';fuzzy.forEach(function(e){h+='<div class="fuzzy">'+e.d+' ';e.c.forEach(function(c){h+='<button class="btn btn-p" style="padding:1px 4px;font-size:8px" onclick="cfm(\''+e.d.replace(/'/g,"\\'")+'\',\''+c+'\')">@'+c+'</button> '});h+='</div>'});h+='</details>'}
  if(none.length){h+='<details><summary style="cursor:pointer;color:var(--rd);font-size:10px">&#x274C;'+none.length+'</summary>';none.forEach(function(n){h+='<div class="nomatch">'+n+'</div>'});h+='</details>'}
  $('dMR').innerHTML=h;render()}
function cfm(dn,tt){discMap[dn.toLowerCase()]=tt;if(C[tt])C[tt].dj=true;rML();mDisc()}

// ===== API =====
var API=window.location.protocol==='file:'?null:'';
function setSt(m,c){var el=$('syncSt');if(el){el.textContent=m;el.style.color=c||'var(--gn)'}}
function buildState(){var st={tracking:{},hist:hist,discMap:discMap,agList:Array.from(agSet),dcList:Array.from(dcSet)};
  Object.values(C).forEach(function(c){st.tracking[c.h]={dj:c.dj,ct:c.ct,rp:c.rp,nt:c.nt,cn:c.cn,ca:c.ca,cv:c.cv,uname:c.uname||'',drole:c.drole||'',email:c.email||'',phone:c.phone||'',fname:c.fname||'',prevTier:c.prevTier||'',tier:c.tier}});return st}
function syncSave(){if(API===null)return expState();setSt("...",'var(--yw)');fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(buildState())}).then(function(r){return r.json()}).then(function(d){setSt(new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 저장');toast('저장 ('+d.dates+'&#xC77C;)')}).catch(function(){setSt("실패","var(--rd)")})}
function syncLoad(){if(API===null)return;setSt("...",'var(--yw)');fetch('/api/state').then(function(r){return r.json()}).then(function(st){applyState(st);ctrlDone=false;render();setSt("로드완료");toast(Object.keys(hist).length+'&#xC77C;')}).catch(function(){setSt("실패","var(--rd)")})}
function trackAPI(h,f,v){autoSave();}
function expState(){var blob=new Blob([JSON.stringify(buildState())],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='biodance_backup_'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('백업 저장')}
function impState(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){try{applyState(JSON.parse(ev.target.result));ctrlDone=false;render();toast('복원 완료')}catch(err){toast('&#xC624;&#xB958;')}};r.readAsText(file);e.target.value=''}

init();
</script></body></html>
