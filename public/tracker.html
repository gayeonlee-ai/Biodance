.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:17px;font-weight:700}.hdr h1 span{color:var(--ac)}
.hdr-acts{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;background:var(--s1);border-bottom:2px solid var(--bd);padding:0 20px;overflow-x:auto}
.tab{padding:10px 14px;cursor:pointer;font-size:11px;font-weight:600;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-2px;transition:.15s;user-select:none;white-space:nowrap}
.tab:hover{color:var(--tx);background:var(--s2)}.tab.on{color:var(--ac);border-bottom-color:var(--ac)}
.tab .bdg{background:var(--rd);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;margin-left:3px;font-weight:700}
.cnt{padding:16px;max-width:1440px;margin:0 auto}.pnl{display:none}.pnl.on{display:block}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px;text-align:center}
.kpi .val{font-size:18px;font-weight:700}.kpi .lbl{font-size:8px;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.tc{display:flex;gap:5px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.si{background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--tx);font-size:12px;width:180px}
.si:focus{outline:none;border-color:var(--ac)}
.fb{background:var(--s2);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;color:var(--dim);font-size:10px;cursor:pointer;font-weight:600;transition:.15s;white-space:nowrap}
.fb:hover{background:var(--s3);color:var(--tx)}.fb.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto;border-radius:8px;border:1px solid var(--bd);max-height:60vh;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--s2);padding:6px 7px;text-align:left;font-size:9px;text-transform:uppercase;letter-spacing:.3px;color:var(--dim);font-weight:700;border-bottom:1px solid var(--bd);position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:hover{color:var(--tx)}td{padding:5px 7px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:hover td{background:var(--s2)}
.h-cell{font-weight:600;white-space:nowrap}.h-cell a{color:var(--ac);text-decoration:none}.h-cell a:hover{text-decoration:underline}
.g-cell{font-weight:700;white-space:nowrap}.g-cell.has{color:var(--gn)}.g-cell.no{color:var(--dim)}
.d-cell{font-size:10px;white-space:nowrap}.d-up{color:var(--gn)}.d-dn{color:var(--rd)}.d-flat{color:var(--dim)}
.cc{text-align:center}.cc input[type=checkbox]{width:14px;height:14px;cursor:pointer;accent-color:var(--ac)}
.tb{display:inline-block;padding:2px 5px;border-radius:4px;font-size:8px;font-weight:700}
.t-new{background:var(--cyb);color:var(--cy)}.t-act{background:var(--gnb);color:var(--gn)}.t-vip{background:var(--ywb);color:var(--yw)}.t-vvip{background:var(--pkb);color:var(--pk)}.t-none{background:var(--s3);color:var(--dim)}
.ag-badge{display:inline-block;font-size:7px;padding:1px 4px;border-radius:3px;background:rgba(230,126,34,.15);color:var(--or);font-weight:700;margin-left:2px}
.ni{background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 4px;color:var(--tx);font-size:10px;width:80px}
.ni:focus{border-color:var(--ac);outline:none;background:var(--s2)}
.tag{display:inline-block;font-size:7px;padding:1px 3px;border-radius:3px;margin-left:2px;font-weight:700}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{background:var(--s1);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.sh{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.sh h3{font-size:11px;display:flex;align-items:center;gap:5px}
.sh .ct{font-size:10px;padding:2px 6px;border-radius:8px;font-weight:700}
.sb{padding:0 12px 10px;max-height:240px;overflow-y:auto}.sb.hide{display:none}
.sb p.desc{font-size:9px;color:var(--dim);margin-bottom:4px}
.si-item{display:flex;align-items:center;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd);font-size:10px}
.si-item:last-child{border-bottom:none}.si-item .hnd{font-weight:600}.si-item .mt{color:var(--dim);font-size:9px}
.btn{border:none;border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:.15s}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ach)}
.btn-s{background:var(--s3);color:var(--tx);border:1px solid var(--bd)}.btn-s:hover{background:var(--s2)}

.snap-box h4{font-size:11px;color:var(--dim);margin-bottom:4px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--gn);color:#fff;padding:10px 16px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateY(0)}
.disc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.disc-box{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:12px}
.disc-box h4{font-size:11px;margin-bottom:5px}
.disc-box p.hint{font-size:10px;color:var(--dim);margin-bottom:6px;line-height:1.4}
.disc-ta{width:100%;height:100px;background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:8px;color:var(--tx);font-size:11px;font-family:monospace;resize:vertical}
.disc-ta:focus{outline:none;border-color:var(--ac)}
.disc-result{margin-top:6px;max-height:160px;overflow-y:auto;font-size:11px}
.match{color:var(--gn);padding:1px 0}.nomatch{color:var(--rd);padding:1px 0}.fuzzy{color:var(--yw);padding:1px 0}
.map-table{width:100%;font-size:10px;border-collapse:collapse;margin-top:4px}
.map-table td,.map-table th{padding:3px 5px;border-bottom:1px solid var(--bd);text-align:left}
.map-table th{font-size:8px;text-transform:uppercase;color:var(--dim)}
.disc-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ds-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:8px;text-align:center}
.ds-card .val{font-size:16px;font-weight:700}.ds-card .lbl{font-size:8px;color:var(--dim);margin-top:1px}
.up-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.up-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px}
.up-card h4{font-size:11px;color:var(--dim);margin-bottom:6px}

.hist-tbl td:first-child{text-align:left;font-weight:600}

  var h='<div class="sg">';segs.forEach(function(seg){
    h+='<div class="sc"><div class="sh" style="background:'+seg.bg+'" onclick="this.nextElementSibling.classList.toggle(\'hide\')"><h3>'+seg.icon+' '+seg.title+'</h3><span class="ct" style="background:'+seg.color+';color:#fff">'+seg.items.length+'</span></div>';
    h+='<div class="sb'+(seg.items.length===0?' hide':'')+'"><p class="desc">'+(seg.desc||'')+'</p>';
    if(!seg.items.length)h+='<p style="font-size:10px;color:var(--dim);text-align:center;padding:8px">-</p>';
    else seg.items.slice(0,50).forEach(function(c){var mt=fmt(c.g)+' &#xB7; '+c.v+'&#xC601;&#xC0C1;';var dg=getDelta(c.h,'g'),dv=getDelta(c.h,'v');
      if(dg>0)mt+=' &#xB7; GMV+'+fmt(dg);if(dv>0)mt+=' &#xB7; V+'+dv;if(c.ag)mt+=' &#xB7; AG';
      h+='<div class="si-item"><span class="hnd">@'+c.h+'</span><span class="mt">'+mt+'</span></div>'});
    h+='</div></div>'});h+='</div>';$('segA').innerHTML=h}

// ===== HISTORY =====
function renderHist(){var dates=Object.keys(hist).sort();
  if(!dates.length){$('histA').innerHTML='<div class="snap-box"><p style="color:var(--dim)">-</p></div>';return}
  var allH=new Set();dates.forEach(function(d){Object.keys(hist[d]).forEach(function(h){allH.add(h)})});
  var handles=Array.from(allH).filter(function(h){return C[h]}).sort(function(a,b){return (C[b]?C[b].g:0)-(C[a]?C[a].g:0)});
  var h='<div class="snap-box"><h4>&#x1F4C5; GMV + &#xC601;&#xC0C1;&#xC218; &#xD2B8;&#xB798;&#xD0B9;</h4>'+
    '<div style="max-height:500px;overflow:auto;border:1px solid var(--bd);border-radius:8px"><table class="hist-tbl"><thead><tr><th>Handle</th>';
  dates.forEach(function(d){h+='<th colspan="2" style="text-align:center;border-left:1px solid var(--bd)">'+d.slice(5)+'</th>'});
  h+='</tr><tr><th></th>';dates.forEach(function(){h+='<th style="text-align:right">GMV</th><th style="text-align:right;border-right:1px solid var(--bd)">V</th>'});
  h+='</tr></thead><tbody>';
  handles.forEach(function(handle){
    h+='<tr><td><a href="https://www.tiktok.com/@'+handle+'" target="_blank" style="color:var(--ac);text-decoration:none;font-size:10px">@'+handle+'</a>';
    if(C[handle]&&C[handle].ag)h+='<span class="ag-badge">AG</span>';h+='</td>';
    dates.forEach(function(d,i){
      var cur=hist[d]&&hist[d][handle]?hist[d][handle]:{g:0,v:0};
      var prev=i>0&&hist[dates[i-1]]&&hist[dates[i-1]][handle]?hist[dates[i-1]][handle]:{g:0,v:0};
      var dg=cur.g-prev.g,dv=cur.v-prev.v;
      h+='<td class="'+(i>0&&dg>0?'d-up':i>0&&dg<0?'d-dn':'')+'" style="border-left:1px solid var(--bd)">'+fmt(cur.g);
      if(i>0&&dg!==0)h+='<span style="font-size:8px"> '+(dg>0?'+'+fmt(dg):fmt(dg))+'</span>';h+='</td>';
      h+='<td style="border-right:1px solid var(--bd)">'+cur.v;if(i>0&&dv>0)h+='<span style="font-size:8px;color:var(--gn)"> +'+dv+'</span>';h+='</td>'});
    h+='</tr>'});
  h+='</tbody></table></div></div>';$('histA').innerHTML=h}

// ===== DISCORD =====
function renderDisc(){var a=Object.values(C);var djC=a.filter(function(c){return c.dj}).length;
  $('discA').innerHTML='<div class="disc-stat"><div class="ds-card"><div class="val" style="color:var(--gn)">'+djC+'</div><div class="lbl">Discord</div></div><div class="ds-card"><div class="val" style="color:var(--rd)">'+(a.length-djC)+'</div><div class="lbl">&#xBBF8;&#xC785;&#xC7A5;</div></div><div class="ds-card"><div class="val" style="color:var(--ac)">'+Object.keys(discMap).length+'</div><div class="lbl">&#xB9E4;&#xD551;</div></div></div>'+
  '<div class="disc-grid"><div><div class="disc-box"><h4>&#x1F4CB; &#xC77C;&#xAD04; Discord</h4><textarea class="disc-ta" id="bulkH" placeholder="&#xD578;&#xB4E4;"></textarea><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-p" onclick="bm(\'dj\',true,\'bulkH\',\'bR\')">&#x2713;</button><button class="btn btn-s" onclick="bm(\'dj\',false,\'bulkH\',\'bR\')">&#x2715;</button></div><div class="disc-result" id="bR"></div></div>'+
  '<div class="disc-box" style="margin-top:10px"><h4>&#x1F4DE; &#xC77C;&#xAD04; &#xC5F0;&#xB77D;/&#xC751;&#xB2F5;</h4><textarea class="disc-ta" id="bulkC" style="height:60px"></textarea><div style="display:flex;gap:4px;margin-top:4px"><button class="btn btn-p" onclick="bm(\'ct\',true,\'bulkC\',\'cR\')">&#xC5F0;&#xB77D;</button><button class="btn btn-p" onclick="bm(\'rp\',true,\'bulkC\',\'cR\')">&#xC751;&#xB2F5;</button></div><div class="disc-result" id="cR"></div></div></div>'+
  '<div><div class="disc-box"><h4>&#x1F517; &#xB2C9;&#xB124;&#xC784; &#xB9E4;&#xD551;</h4><div style="display:flex;gap:4px;margin-bottom:4px"><input class="si" id="mDN" placeholder="Discord" style="width:44%"><input class="si" id="mTT" placeholder="TikTok" style="width:44%"><button class="btn btn-p" onclick="addM()" style="padding:6px 8px">+</button></div><div id="mL"></div></div>'+
  '<div class="disc-box" style="margin-top:10px"><h4>&#x1F4E5; &#xBA64;&#xBC84; &#xBAA9;&#xB85D; &#xB9E4;&#xCE6D;</h4><textarea class="disc-ta" id="dMem" style="height:70px" placeholder="Discord &#xBA64;&#xBC84;"></textarea><button class="btn btn-p" style="margin-top:4px" onclick="mDisc()">&#x1F50D;</button><div class="disc-result" id="dMR"></div></div></div></div>';rML()}
function bm(field,val,taId,resId){var text=$(taId).value.trim();if(!text)return;var hs=text.split('\n').map(function(h){return h.trim().toLowerCase().replace(/^@/,'')}).filter(Boolean);var ok=0,bad=[];hs.forEach(function(h){if(C[h]){C[h][field]=val;ok++}else bad.push(h)});
  $(resId).innerHTML='<p style="color:var(--gn)">&#x2705;'+ok+'</p>'+(bad.length?'<p style="color:var(--rd)">&#x274C;'+bad.join(', ')+'</p>':'');render()}
function addM(){var dn=$('mDN').value.trim(),tt=$('mTT').value.trim().toLowerCase().replace(/^@/,'');if(!dn||!tt)return;if(!C[tt]){toast('@'+tt+' &#xC5C6;&#xC74C;');return}discMap[dn.toLowerCase()]=tt;$('mDN').value='';$('mTT').value='';rML();toast(dn+'&#x2192;@'+tt)}
function delM(k){delete discMap[k];rML()}
function rML(){var el=$('mL');if(!el)return;var e=Object.entries(discMap);if(!e.length){el.innerHTML='<p style="font-size:10px;color:var(--dim)">-</p>';return}
  var h='<table class="map-table"><thead><tr><th>DC</th><th>TT</th><th></th></tr></thead><tbody>';
  e.slice(0,20).forEach(function(p){h+='<tr><td>'+p[0]+'</td><td>@'+p[1]+'</td><td><button class="btn btn-d" style="padding:1px 4px;font-size:8px" onclick="delM(\''+p[0].replace(/'/g,"\\'")+'\')">x</button></td></tr>'});
  if(e.length>20)h+='<tr><td colspan=3 style="color:var(--dim)">...+</td></tr>';h+='</tbody></table>';el.innerHTML=h}
function lev(a,b){var m=a.length,n=b.length,d=[];for(var i=0;i<=m;i++){d[i]=[];for(var j=0;j<=n;j++)d[i][j]=0;d[i][0]=i}for(var j=0;j<=n;j++)d[0][j]=j;for(var i=1;i<=m;i++)for(var j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));return d[m][n]}
function mDisc(){var text=$('dMem').value.trim();if(!text)return;var mems=text.split('\n').map(function(m){return m.trim()}).filter(Boolean);var ks=Object.keys(C);var exact=[],mapped=[],fuzzy=[],none=[];
  mems.forEach(function(m){var ml=m.toLowerCase().replace(/^@/,'');if(C[ml]){C[ml].dj=true;exact.push(ml);return}if(discMap[ml]&&C[discMap[ml]]){C[discMap[ml]].dj=true;mapped.push(ml+'&#x2192;'+discMap[ml]);return}
  var cands=ks.filter(function(h){return(ml.length>=4&&h.indexOf(ml)>=0)||(ml.length>=4&&ml.indexOf(h)>=0)||(lev(ml,h)<=2&&ml.length>=4)});if(cands.length)fuzzy.push({d:m,c:cands});else none.push(m)});
  var h='<p style="font-weight:600;font-size:10px">'+(exact.length+mapped.length)+'/'+mems.length+'</p>';
  if(fuzzy.length){h+='<details open><summary style="cursor:pointer;color:var(--yw);font-size:10px">&#x1F7E1;'+fuzzy.length+'</summary>';fuzzy.forEach(function(e){h+='<div class="fuzzy">'+e.d+' ';e.c.forEach(function(c){h+='<button class="btn btn-p" style="padding:1px 4px;font-size:8px" onclick="cfm(\''+e.d.replace(/'/g,"\\'")+'\',\''+c+'\')">@'+c+'</button> '});h+='</div>'});h+='</details>'}
  $('dMR').innerHTML=h;render()}
function cfm(dn,tt){discMap[dn.toLowerCase()]=tt;if(C[tt])C[tt].dj=true;rML();mDisc()}

// ===== EXPORT/IMPORT =====
function expState(){var st={_v:5,_date:new Date().toISOString(),hist:hist,discMap:discMap,agList:Array.from(agSet),dcList:Array.from(dcSet),tracking:{}};
  Object.values(C).forEach(function(c){if(c.dj||c.ct||c.rp||c.nt||c.cn||c.ca||c.cv)st.tracking[c.h]={dj:c.dj,ct:c.ct,rp:c.rp,nt:c.nt,cn:c.cn,ca:c.ca,cv:c.cv}});
  var blob=new Blob([JSON.stringify(st)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='biodance_'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('&#xC800;&#xC7A5;')}
function impState(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){try{var st=JSON.parse(ev.target.result);
  if(st.tracking)Object.keys(st.tracking).forEach(function(h){var d=st.tracking[h];if(C[h]){C[h].dj=d.dj||false;C[h].ct=d.ct||false;C[h].rp=d.rp||false;C[h].nt=d.nt||'';C[h].cn=d.cn||false;C[h].ca=d.ca||false;C[h].cv=d.cv||false}});
  if(st.hist)Object.keys(st.hist).forEach(function(d){if(!hist[d])hist[d]=st.hist[d]});
  if(st.discMap)Object.assign(discMap,st.discMap);
  if(st.agList){st.agList.forEach(function(h){agSet.add(h)});Object.values(C).forEach(function(c){c.ag=agSet.has(c.h)})}
  if(st.dcList){st.dcList.forEach(function(h){dcSet.add(h);if(C[h])C[h].dj=true})}
  ctrlDone=false;render();toast(Object.keys(hist).length+'&#xC77C; &#xD788;&#xC2A4;&#xD1A0;&#xB9AC;')}catch(err){toast('&#xC624;&#xB958;')}};r.readAsText(file);e.target.value=''}


// ===== API SYNC =====
var API = window.location.hostname === 'localhost' || window.location.protocol === 'file:' ? null : '';
var saving=false;

function syncSave(){
  if(!API&&API!=='')return expState(); // fallback to file if local
  var st={tracking:{},hist:hist,discMap:discMap,agList:Array.from(agSet),dcList:Array.from(dcSet)};
  Object.values(C).forEach(function(c){if(c.dj||c.ct||c.rp||c.nt||c.cn||c.ca||c.cv)st.tracking[c.h]={dj:c.dj,ct:c.ct,rp:c.rp,nt:c.nt,cn:c.cn,ca:c.ca,cv:c.cv}});
  $('syncStatus').textContent='저장중...';$('syncStatus').style.color='var(--yw)';
  fetch('/api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(st)})
    .then(function(r){return r.json()}).then(function(d){
      $('syncStatus').textContent='저장 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
      $('syncStatus').style.color='var(--gn)';toast('서버 저장 ('+d.dates+'일 히스토리)')})
    .catch(function(e){$('syncStatus').textContent='저장 실패';$('syncStatus').style.color='var(--rd)';toast('저장 실패')});
}

function syncLoad(){
  if(!API&&API!==''){toast('로컬 파일 모드');return}
  $('syncStatus').textContent='불러오는중...';$('syncStatus').style.color='var(--yw)';
  fetch('/api/state').then(function(r){return r.json()}).then(function(st){
    if(st.tracking)Object.keys(st.tracking).forEach(function(h){var d=st.tracking[h];if(C[h]){C[h].dj=d.dj||false;C[h].ct=d.ct||false;C[h].rp=d.rp||false;C[h].nt=d.nt||'';C[h].cn=d.cn||false;C[h].ca=d.ca||false;C[h].cv=d.cv||false}});
    if(st.hist)Object.keys(st.hist).forEach(function(d){if(!hist[d])hist[d]=st.hist[d]});
    if(st.discMap)Object.assign(discMap,st.discMap);
    if(st.agList){st.agList.forEach(function(h){agSet.add(h)});Object.values(C).forEach(function(c){c.ag=agSet.has(c.h)})}
    if(st.dcList){st.dcList.forEach(function(h){dcSet.add(h);if(C[h])C[h].dj=true})}
    ctrlDone=false;render();
    $('syncStatus').textContent='로드 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
    $('syncStatus').style.color='var(--gn)';toast(Object.keys(hist).length+'일 히스토리')})
  .catch(function(e){$('syncStatus').textContent='로드 실패';$('syncStatus').style.color='var(--rd)'});
}

// Auto-save single checkbox to server
function trackAPI(h,f,v){
  if(!API&&API!=='')return;
  fetch('/api/track',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({handle:h,field:f,value:v})}).catch(function(){});
}

// Auto-save history snapshot to server
function snapAPI(){
  if(!API&&API!=='')return;
  var d=today(),snap={};Object.values(C).forEach(function(c){snap[c.h]={g:c.g,v:c.v}});
  fetch('/api/history',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:d,snapshot:snap})})
    .then(function(r){return r.json()}).then(function(d){
      $('syncStatus').textContent='히스토리 저장';$('syncStatus').style.color='var(--gn)'})
    .catch(function(){});
}

init();
</script></body></html>
