function fmt(n) { if (!n && n !== 0) return '-'; return '$' + Number(n).toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 0}); }

}

function parseCSV(text) {
  var rows = [], row = [], field = '', inQ = false, i = 0, c;
  text = text.replace(/^\uFEFF/, '');
  while (i < text.length) {
    c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { field += '"'; i += 2; } else { inQ = false; i++; } }
      else { field += c; i++; }
    } else {
      if (c === '"') { inQ = true; i++; }
      else if (c === ',') { row.push(field.trim()); field = ''; i++; }
      else if (c === '\n' || c === '\r') {
        row.push(field.trim());
        if (row.some(function(x) { return x !== ''; })) rows.push(row);
        row = []; field = '';
        if (c === '\r' && text[i+1] === '\n') i += 2; else i++;
      } else { field += c; i++; }
    }
  }
  row.push(field.trim());
  if (row.some(function(x) { return x !== ''; })) rows.push(row);
  if (rows.length < 2) return [];
  var hdr = rows[0];
  return rows.slice(1).map(function(r) { var o = {}; hdr.forEach(function(h, j) { o[h] = r[j] || ''; }); return o; });
}

      uname: c.uname || '', email: c.email || '', phone: c.phone || '', prevTier: c.prevTier || '', tier: c.tier};
  });
  return s;
}

function applyState(st) {
  if (st.tracking) {
    Object.keys(st.tracking).forEach(function(h) {
      var d = st.tracking[h]; if (!C[h]) return;
      if (d.dj !== undefined) C[h].dj = d.dj;
      if (d.ct !== undefined) C[h].ct = d.ct;
      if (d.rp !== undefined) C[h].rp = d.rp;
      if (d.nt !== undefined) C[h].nt = d.nt;
      if (d.cn !== undefined) C[h].cn = d.cn;
      if (d.ca !== undefined) C[h].ca = d.ca;
      if (d.cv !== undefined) C[h].cv = d.cv;
      if (d.uname !== undefined) C[h].uname = d.uname;
      if (d.email !== undefined) C[h].email = d.email;
      if (d.phone !== undefined) C[h].phone = d.phone;
      if (d.prevTier !== undefined) C[h].prevTier = d.prevTier;
      if (d.tier) C[h].tier = d.tier;
    });
  }
  if (st.hist) {
    Object.keys(st.hist).forEach(function(d) { hist[d] = st.hist[d]; });
    // Remove duplicate adjacent dates
    var dates = Object.keys(hist).sort();
    for (var i = 1; i < dates.length; i++) {
      if (JSON.stringify(hist[dates[i-1]]) === JSON.stringify(hist[dates[i]])) {
        delete hist[dates[i-1]];
      }
    }
  }
  if (st.discMap) Object.assign(discMap, st.discMap);
  if (st.agList) st.agList.forEach(function(h) { agSet.add(h); });
  if (st.dcList) { st.dcList.forEach(function(h) { dcSet.add(h); if (C[h]) C[h].dj = true; }); }
  // Apply latest hist GMV
  var dates2 = Object.keys(hist).sort();
  var latest = dates2[dates2.length - 1];
  if (latest && hist[latest]) {
    Object.keys(hist[latest]).forEach(function(h) {
      if (C[h] && hist[latest][h]) {
        C[h].g = hist[latest][h].g;
        C[h].v = hist[latest][h].v;
        C[h].tier = tier(C[h].g, C[h].v);
      }
    });
  }
  Object.values(C).forEach(function(c) { c.ag = agSet.has(c.h); });
}

function pf(file, type) {
  var r = new FileReader();
  r.onload = function(ev) {
    var data = parseCSV(ev.target.result);
    if (type === 'p') {
      // Fetch latest server state first, then rebuild to preserve checkboxes
      function doRebuild(serverTracking, serverDiscMap, serverHist) {
        // Merge current C state with server state (server wins)
        var saved = {};
        Object.values(C).forEach(function(c) {
          saved[c.h] = {dj:c.dj,ct:c.ct,rp:c.rp,nt:c.nt,cn:c.cn,ca:c.ca,cv:c.cv,
            uname:c.uname||'',email:c.email||'',phone:c.phone||'',tier:c.tier,
            video_gmv:c.video_gmv||0,live_gmv:c.live_gmv||0};
        });
        // Server state overrides local
        if (serverTracking) {
          Object.keys(serverTracking).forEach(function(h) {
            var d = serverTracking[h];
            if (!saved[h]) saved[h] = {};
            ['dj','ct','rp','nt','cn','ca','cv','uname','email','phone','tier'].forEach(function(k) {
              if (d[k] !== undefined) saved[h][k] = d[k];
            });
          });
        }
        if (serverDiscMap) Object.assign(discMap, serverDiscMap);
        if (serverHist) Object.keys(serverHist).forEach(function(d) { if (!hist[d]) hist[d] = serverHist[d]; });
        C = {};
        data.forEach(function(row) {
          var h = (row['Creator Handle']||'').replace('@','').trim().toLowerCase(); if(!h)return;
          var g = parseFloat((row['Total GMV']||'0').replace(/[$,]/g,''))||0;
          var v = parseInt(row['Videos'])||0;
          var w = parseInt((row['Total Views']||'0').replace(/,/g,''))||0;
          var o = saved[h]||{};
          var dci = DC_INFO[h]||{}; var ct = CONTACTS[h]||{};
          var sb = SUBS_DATA[h]||{vg:0,vc:0,lg:0,lc:0};
          C[h] = {h:h,g:g,v:v,w:w,
            dj:o.dj!==undefined?o.dj:dcSet.has(h),
            ct:o.ct||false,rp:o.rp||false,nt:o.nt||'',ag:agSet.has(h),
            cn:o.cn||false,ca:o.ca||false,cv:o.cv||false,
            uname:o.uname||dci.u||'',email:o.email||ct.em||'',
            phone:o.phone||ct.ph||'',prevTier:o.tier||'',tier:o.tier||tier(g,v),
            video_gmv:o.video_gmv||sb.vg||0,video_count:sb.vc||0,
            live_gmv:o.live_gmv||sb.lg||0,live_count:sb.lc||0};
        });
        var td = today();
        var snap = {}; Object.values(C).forEach(function(c){snap[c.h]={g:c.g,v:c.v};});
        hist[td] = snap;
        Object.values(C).forEach(function(c){c.ag=agSet.has(c.h);});
        render();
        setTimeout(function(){syncSave();},800);
        toast('업로드 완료 ('+Object.keys(C).length+'명)');
      }
      if (API !== null) {
        fetch('/api/state')
          .then(function(r){return r.json();})
          .then(function(st){doRebuild(st.tracking,st.discMap,st.hist);})
          .catch(function(){doRebuild(null,null,null);});
      } else {
        doRebuild(null,null,null);
      }
    } else if (type === 's') {
      data.forEach(function(row) {
        var h = (row['Creator']||'').trim().toLowerCase().replace(/^@/,'');
        var t = row['Type']||'';
        var g = parseFloat((row['GMV']||'0').replace(/[$,]/g,''))||0;
        if (C[h]) {
          if (t==='Video'){C[h].video_gmv=(C[h].video_gmv||0)+g;C[h].video_count=(C[h].video_count||0)+1;}
          else if (t==='Livestream'){C[h].live_gmv=(C[h].live_gmv||0)+g;C[h].live_count=(C[h].live_count||0)+1;}
        }
      });
      render(); toast('Submissions 로드됨');
      if ($('stS')) $('stS').textContent = '✅ 로드됨';
    }
  };
  r.readAsText(file);
}


function lfDC(file) {
  var r = new FileReader();
  r.onload = function(ev) {
    var data = parseCSV(ev.target.result); var ok = 0;
    data.forEach(function(row) {
      var tt = (row['TikTok Handles'] || '').trim().toLowerCase().replace(/^@/, '');
      var du = (row['Discord Username'] || '').trim().toLowerCase();
      if (tt && C[tt]) { C[tt].dj = true; if (du) { C[tt].uname = du; discMap[du] = tt; } ok++; dcSet.add(tt); }
    });
    render(); toast('Discord: ' + ok + '명');
  };
  r.readAsText(file);
}

function lfMB(file) {
  var r = new FileReader();
  r.onload = function(ev) {
    var data = parseCSV(ev.target.result); var ok = 0;
    data.forEach(function(row) {
      var tt = (row['TikTok Handle'] || '').trim().toLowerCase().replace(/^@/, '');
      var em = row['Email'] || '';
      if (tt && C[tt] && em) { C[tt].email = em; ok++; }
    });
    render(); if ($('stMB')) { $('stMB').textContent = '✅ ' + ok + '명'; $('stMB').className = 'us ok'; }
    toast('이메일 +' + ok);
  };
  r.readAsText(file);
}

function renderTrk() {
  var a = Object.values(C);

  var n_djy = a.filter(function(c) { return c.dj; }).length;
  var n_djn = a.filter(function(c) { return !c.dj && !c.ag; }).length;
  var n_ag  = a.filter(function(c) { return c.ag; }).length;
  var n_sur = a.filter(function(c) { return getDelta(c.h, 'g') > 0; }).length;
  var n_nv  = a.filter(function(c) { return getDelta(c.h, 'v') > 0; }).length;

  function mb(label, key, val, cnt) {

  }
  function mbb(label, key, cnt) {
    var on = MF[key];
    return '<button class="fb' + (on ? ' on' : '') + '" onclick="toggleMFb(\'' + key + '\')">' + label + (cnt !== undefined ? ' (' + cnt + ')' : '') + '</button>';
  }

  var fbHTML = '<div class="fbrow">';
  // search in HTML
  fbHTML += '<span class="fblabel">TIER:</span>';
  fbHTML += mb('&#x1F331;New', 'tier', 'new', n_new);
  fbHTML += mb('&#x1F45F;Active', 'tier', 'active', n_act);
  fbHTML += mb('&#x2B50;VIP+', 'tier', 'vip', n_vip);
  fbHTML += '<span class="fblabel">DC:</span>';
  fbHTML += mb('DC&#x2713;', 'dc', 'y', n_djy);
  fbHTML += mb('DC&#x2715;', 'dc', 'n', n_djn);
  fbHTML += mb('AG', 'dc', 'ag', n_ag);
  fbHTML += '<span class="fblabel">기타:</span>';
  fbHTML += mbb('GMV&#x2191;', 'surge', n_sur);
  fbHTML += mbb('&#xC601;&#xC0C1;&#x2191;', 'nv', n_nv);
  fbHTML += mbb('&#xC601;&#xC0C1;O/&#xB9E4;&#xCD9C;X', 'vid', n_vng);
  fbHTML += mbb('&#x1F4FA;&#xB77C;&#xC774;&#xBE0C;O', 'live', n_lv);
  if (MF.tier || MF.dc || MF.surge || MF.nv || MF.vid || MF.live) {
    fbHTML += '<button class="fb rst" onclick="resetMF()">&#x2715; 초기화</button>';
  }
  fbHTML += '</div>';

  var f = a.slice();
  if (sq) f = f.filter(function(c) { return c.h.indexOf(sq.toLowerCase()) >= 0 || (c.uname || '').indexOf(sq.toLowerCase()) >= 0; });
  if (MF.tier === 'new') f = f.filter(function(c) { return c.tier === 'new'; });
  else if (MF.tier === 'active') f = f.filter(function(c) { return c.tier === 'active'; });
  else if (MF.tier === 'vip') f = f.filter(function(c) { return c.tier === 'vip' || c.tier === 'vvip'; });
  if (MF.dc === 'y') f = f.filter(function(c) { return c.dj; });
  else if (MF.dc === 'n') f = f.filter(function(c) { return !c.dj && !c.ag; });
  else if (MF.dc === 'ag') f = f.filter(function(c) { return c.ag; });
  if (MF.surge) f = f.filter(function(c) { return getDelta(c.h, 'g') > 0; });
  if (MF.nv) f = f.filter(function(c) { return getDelta(c.h, 'v') > 0; });
  if (MF.vid) f = f.filter(function(c) { return c.v > 0 && c.g === 0; });
  if (MF.live) f = f.filter(function(c) { return c.live_gmv > 0; });
  // Column header checkbox filters
  if (MF.dc === 'y') f = f.filter(function(c) { return c.dj; });
  else if (MF.dc === 'n') f = f.filter(function(c) { return !c.dj; });
  if (MF.cn === 'y') f = f.filter(function(c) { return c.cn; });
  else if (MF.cn === 'n') f = f.filter(function(c) { return !c.cn; });
  if (MF.ca === 'y') f = f.filter(function(c) { return c.ca; });
  else if (MF.ca === 'n') f = f.filter(function(c) { return !c.ca; });
  if (MF.cv === 'y') f = f.filter(function(c) { return c.cv; });
  else if (MF.cv === 'n') f = f.filter(function(c) { return !c.cv; });
  if (MF.ct === 'y') f = f.filter(function(c) { return c.ct; });
  else if (MF.ct === 'n') f = f.filter(function(c) { return !c.ct; });
  if (MF.rp === 'y') f = f.filter(function(c) { return c.rp; });
  else if (MF.rp === 'n') f = f.filter(function(c) { return !c.rp; });

  f.sort(function(a, b) {
    var va = a[sCol], vb = b[sCol];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    return sDir === 'desc' ? (va > vb ? -1 : va < vb ? 1 : 0) : (va < vb ? -1 : va > vb ? 1 : 0);
  });

  function si(col) { return sCol === col ? '<span style="font-size:8px;margin-left:1px">' + (sDir === 'desc' ? '&#x25BC;' : '&#x25B2;') + '</span>' : ''; }
  function th(lbl, col) { return '<th onclick="ts(\'' + col + '\')" style="cursor:pointer">' + lbl + si(col) + '</th>'; }

  // Column dropdown filter
  function mkDD(id, opts) {
    var dd = '<div id="' + id + '" class="col-dd" style="display:none;position:absolute;top:100%;left:0;min-width:130px;background:var(--s1);border:1px solid var(--bd);border-radius:5px;padding:6px;z-index:999;box-shadow:0 4px 12px rgba(0,0,0,.5)">';
    opts.forEach(function(o) {
      dd += '<div onclick="setColF(\'' + id + '\',\'' + o[1] + '\');event.stopPropagation()" style="padding:4px 6px;cursor:pointer;font-size:10px;border-radius:3px;font-weight:normal" onmouseover="this.style.background=\'rgba(88,101,242,.2)\'" onmouseout="this.style.background=\'transparent\'">' + o[0] + '</div>';
    });
    dd += '</div>';
    return dd;
  }
  function thDD(lbl, col, opts) {
    var isActive = (MF[col] !== null && MF[col] !== undefined);
    var bg = isActive ? 'background:rgba(88,101,242,.12);' : '';
    var check = isActive ? '<span style="color:var(--ac);font-size:8px;margin-left:2px">&#x2713;</span>' : '';
    return '<th style="position:relative;cursor:pointer;' + bg + '"><span onclick="ts(\'' + col + '\')">' + lbl + si(col) + '</span>' + check +
      ' <span onclick="event.stopPropagation();toggleColDD(\'' + col + '_dd\')" style="cursor:pointer;opacity:.6;font-size:9px">&#x25BE;</span>' +
      mkDD(col + '_dd', opts) + '</th>';
  }
  function thCkDD(lbl, col) {
    var isActive = (MF[col] !== null && MF[col] !== undefined);
    var bg = isActive ? 'background:rgba(88,101,242,.12);' : '';
    var check = isActive ? '<span style="color:var(--ac);font-size:7px;display:block">' + (MF[col]==='y' ? '&#x2713;O' : '&#x2715;X') + '</span>' : '';
    return '<th class="cc" style="position:relative;' + bg + '">' + lbl + check +
      '<span onclick="event.stopPropagation();toggleColDD(\'' + col + '_dd\')" style="cursor:pointer;opacity:.6;font-size:8px;display:block">&#x25BE;</span>' +
      mkDD(col + '_dd', [['전체', '__all__'], ['&#x2713; O', 'y'], ['&#x2715; X', 'n']]) + '</th>';
  }
  var tbl = '<div class="tw"><table><thead><tr>' +
    thDD('Handle', 'h', [['전체','__all__']]) +
    thDD('Tier', 'tier', [['전체','__all__'],['🌱 New','new'],['👟 Active','active'],['⭐ VIP+','vip']]) +
    th('GMV', 'g') + '<th>&#x0394;GMV</th>' +
    th('V', 'v') + '<th>&#x0394;V</th>' +
    '<th>&#x1F3AC;GMV</th><th>&#x1F4FA;GMV</th>' +
    (CV.dc ? thCkDD('DC','dc') : '') +
    (CV.cn ? thCkDD('&#x1F331;','cn') : '') +
    (CV.ca ? thCkDD('&#x1F45F;','ca') : '') +
    (CV.cv ? thCkDD('&#x2B50;','cv') : '') +
    (CV.ct ? thCkDD('&#xC5F0;&#xB77D;','ct') : '') +
    (CV.rp ? thCkDD('&#xC751;&#xB2F5;','rp') : '') +
    (CV.nt ? '<th>&#xBA54;&#xBAA8;</th>' : '') +
    '<th>&#xC774;&#xBA54;&#xC77C;</th>' +
    '</tr></thead><tbody>';

  f.forEach(function(c) {
    var dg = getDelta(c.h, 'g'), dv = getDelta(c.h, 'v');
    var pd = prevDay(); var isN = pd && hist[pd] && !hist[pd][c.h];
    var isUp = c.prevTier && c.prevTier !== c.tier && c.prevTier !== 'none';
    var vg = c.video_gmv || 0, lg = c.live_gmv || 0;
    var row = '<tr>';
    row += '<td class="hc"><a href="https://www.tiktok.com/@' + c.h + '" target="_blank">@' + c.h + '</a>';
    if (c.uname) row += '<span class="un">' + c.uname + '</span>';
    if (c.ag) row += '<span class="ag">AG</span>';
    if (isN) row += '<span style="font-size:7px;padding:1px 3px;border-radius:2px;background:var(--cyb);color:var(--cy);margin-left:2px">NEW</span>';
    row += '</td>';

    if (isUp) row += '<span class="tu">&#x2B06;</span>';
    row += '</td>';

    row += '<td>' + c.v + '</td>';
    row += '<td class="' + (dv > 0 ? 'du' : 'df') + '">' + (dv === null ? '-' : dv > 0 ? '+' + dv : '-') + '</td>';
    row += '<td class="' + (vg > 0 ? 'du' : 'df') + '">' + (vg > 0 ? fmt(vg) : '-') + '</td>';
    row += '<td class="' + (lg > 0 ? 'du' : 'df') + '">' + (lg > 0 ? '<span class="lv">LIVE</span>' + fmt(lg) : '-') + '</td>';
    if (CV.dc) row += '<td class="cc"><input type="checkbox"' + (c.dj ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'dj\',this.checked)"></td>';
    if (CV.cn) row += '<td class="cc">' + (c.ag ? '' : '<input type="checkbox"' + (c.cn ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'cn\',this.checked)">') + '</td>';
    if (CV.ca) row += '<td class="cc">' + (c.ag ? '' : '<input type="checkbox"' + (c.ca ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'ca\',this.checked)">') + '</td>';
    if (CV.cv) row += '<td class="cc">' + (c.ag ? '' : '<input type="checkbox"' + (c.cv ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'cv\',this.checked)">') + '</td>';
    if (CV.ct) row += '<td class="cc"><input type="checkbox"' + (c.ct ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'ct\',this.checked)"></td>';
    if (CV.rp) row += '<td class="cc"><input type="checkbox"' + (c.rp ? ' checked' : '') + ' onchange="upd(\'' + c.h + '\',\'rp\',this.checked)"></td>';
    if (CV.nt) row += '<td><input class="ni" value="' + (c.nt || '') + '" placeholder="..." oninput="updStr(\'' + c.h + '\',\'nt\',this.value)" onblur="updStr(\'' + c.h + '\',\'nt\',this.value)"></td>';

    row += '</tr>';

  tbl += '</tbody></table></div><p style="margin-top:5px;font-size:9px;color:var(--dim)">' + f.length + '/' + a.length + '</p>';

}

function ts(col) { if (sCol === col) sDir = sDir === 'desc' ? 'asc' : 'desc'; else { sCol = col; sDir = 'desc'; } renderTrk(); }
function toggleColDD(id) {
  document.querySelectorAll('.col-dd').forEach(function(d) { if (d.id !== id) d.style.display='none'; });
  var el = document.getElementById(id);
  if (el) el.style.display = (el.style.display === 'none' ? 'block' : 'none');
}
function setColF(ddId, val) {
  var col = ddId.replace('_dd','');
  MF[col] = (val === '__all__') ? null : val;
  document.querySelectorAll('.col-dd').forEach(function(d){d.style.display='none';});
  renderTrk();
}
document.addEventListener('click', function() {
  document.querySelectorAll('.col-dd').forEach(function(d){d.style.display='none';});
});

function setMFck(key, val) {

document.addEventListener('click', function(e) {

function renderSeg() {
  var a = Object.values(C); var pd = prevDay();
  var newC = a.filter(function(c) { return c.tier === 'new'; });
  var actC = a.filter(function(c) { return c.tier === 'active'; });
  var vipC = a.filter(function(c) { return c.tier === 'vip' || c.tier === 'vvip'; });

  function card(seg) {
    var html = '<div class="sc"><div class="sh" style="background:' + seg.bg + '" onclick="var b=this.nextElementSibling;b.style.display=b.style.display===\'none\'?\'block\':\'none\'">';
    html += '<h3>' + seg.icon + ' ' + seg.title + '</h3><span class="ct" style="background:' + seg.color + ';color:#fff">' + seg.items.length + '</span></div>';
    html += '<div class="si2" style="' + (seg.items.length === 0 ? 'display:none' : '') + '">';
    if (seg.desc) html += '<p class="desc">' + seg.desc + '</p>';
    if (!seg.items.length) { html += '<p style="font-size:10px;color:var(--dim);text-align:center;padding:8px">해당없음</p>'; }
    else {
      seg.items.slice(0, 40).forEach(function(c) {
        var mt = fmt(c.g);
        var dg = getDelta(c.h, 'g'), dv = getDelta(c.h, 'v');
        if (dg > 0) mt += ' <b style="color:var(--gn)">+' + fmt(dg) + '</b>';
        mt += ' · ' + c.v + '개';
        if (dv > 0) mt += ' <b style="color:var(--gn)">+' + dv + '</b>';
        if (c.live_gmv > 0) mt += ' <span class="lv">라이브 ' + fmt(c.live_gmv) + '</span>';
        if (c.uname) mt += ' <span style="font-size:8px;color:#888">' + c.uname + '</span>';
        html += '<div class="row"><span class="h">@' + c.h + (c.ag ? '<span class="ag">AG</span>' : '') + '</span><span class="m">' + mt + '</span></div>';
      });
    }
    html += '</div></div>'; return html;
  }

  function section(title, col, segs) {
    var html = '<div style="margin-bottom:18px"><div class="sg-hdr" style="color:' + col + '">' + title + '</div><div class="sg">';
    segs.forEach(function(s) { html += card(s); });
    html += '</div></div>'; return html;
  }

  var common = [
    {icon:'&#x26A0;',title:'채널 미배정',color:'var(--rd)',bg:'var(--rdb)',
      items:a.filter(function(c){return c.dj&&!c.ag&&((c.tier==='new'&&!c.cn)||(c.tier==='active'&&!c.ca)||((c.tier==='vip'||c.tier==='vvip')&&!c.cv));}),
      desc:'Discord 입장O / Tier 채널 미배정'},
    {icon:'&#x1F199;',title:'Tier 업 알림',color:'var(--pk)',bg:'var(--pkb)',
      items:a.filter(function(c){return c.prevTier&&c.prevTier!==c.tier&&c.prevTier!=='none';}).sort(function(a,b){return b.g-a.g;}),
      desc:'전일 대비 Tier 상승'},
    {icon:'&#x1F6AA;',title:'Discord 미입장',color:'var(--rd)',bg:'var(--rdb)',
      items:a.filter(function(c){return !c.dj&&!c.ct&&!c.ag;}),desc:'AG 제외'},
    {icon:'&#x1F4DE;',title:'연락/미응답',color:'var(--or)',bg:'var(--orb)',
      items:a.filter(function(c){return c.ct&&!c.rp;})}
  ];

  var celebrate = [
    {icon:'&#x1F389;',title:'첫 영상 업로드!',color:'var(--cy)',bg:'var(--cyb)',
      items:pd?a.filter(function(c){var pv=hist[pd][c.h]?hist[pd][c.h].v:0;return pv===0&&c.v>0;}):[],
      desc:'new-creator 채널에서 멘션'},
    {icon:'&#x1F4B0;',title:'첫 매출 발생!',color:'var(--gn)',bg:'var(--gnb)',
      items:pd?a.filter(function(c){var pg=hist[pd][c.h]?hist[pd][c.h].g:0;return pg===0&&c.g>0;}):[],
      desc:'채널에서 멘션'},
    {icon:'&#x1F4C8;',title:'GMV +$50 이상',color:'var(--yw)',bg:'var(--ywb)',
      items:a.filter(function(c){var d=getDelta(c.h,'g');return d!==null&&d>=50;}).sort(function(a,b){return getDelta(b.h,'g')-getDelta(a.h,'g');})},
    {icon:'&#x1F3AC;',title:'영상 +2개 이상',color:'var(--pk)',bg:'var(--pkb)',
      items:a.filter(function(c){var d=getDelta(c.h,'v');return d!==null&&d>=2;}).sort(function(a,b){return getDelta(b.h,'v')-getDelta(a.h,'v');})}
  ];

  var newSegs = [
    {icon:'&#x1F389;',title:'첫 영상!',color:'var(--cy)',bg:'var(--cyb)',
      items:pd?newC.filter(function(c){var pv=hist[pd][c.h]?hist[pd][c.h].v:0;return pv===0&&c.v>0;}):[],
      desc:'new-creator 채널에서 멘션'},
    {icon:'&#x1F3AC;',title:'영상O / 매출X',color:'var(--pp)',bg:'var(--ppb)',
      items:newC.filter(function(c){return c.v>0&&c.g===0;}).sort(function(a,b){return b.v-a.v;}),desc:'넛징 필요'},
    {icon:'&#x2B50;',title:'Active 임박',color:'var(--gn)',bg:'var(--gnb)',
      items:newC.filter(function(c){return c.g>0;}).sort(function(a,b){return b.g-a.g;})},
    {icon:'&#x1F4A4;',title:'영상도 매출도 없음',color:'var(--dim)',bg:'rgba(139,141,148,.06)',
      items:newC.filter(function(c){return c.v===0;})}
  ];

  var actSegs = [
    {icon:'&#x1F4C8;',title:'GMV 급등',color:'var(--yw)',bg:'var(--ywb)',
      items:actC.filter(function(c){var d=getDelta(c.h,'g');return d!==null&&d>0;}).sort(function(a,b){return getDelta(b.h,'g')-getDelta(a.h,'g');}),
      desc:'채널에서 칭찬/넛징'},
    {icon:'&#x2B50;',title:'VIP 임박 ($300+)',color:'var(--yw)',bg:'var(--ywb)',
      items:actC.filter(function(c){return c.g>=300;}).sort(function(a,b){return b.g-a.g;}),
      desc:'$500 도달시 VIP 이동'},
    {icon:'&#x1F4FA;',title:'라이브 GMV 발생',color:'var(--pp)',bg:'var(--ppb)',
      items:actC.filter(function(c){return c.live_gmv>0;}).sort(function(a,b){return b.live_gmv-a.live_gmv;}),
      desc:'라이브 담당자에게 전달'}
  ];

  var vipSegs = [
    {icon:'&#x1F4C8;',title:'GMV 급등',color:'var(--yw)',bg:'var(--ywb)',
      items:vipC.filter(function(c){var d=getDelta(c.h,'g');return d!==null&&d>0;}).sort(function(a,b){return getDelta(b.h,'g')-getDelta(a.h,'g');})},
    {icon:'&#x1F451;',title:'VVIP 임박 ($700+)',color:'var(--pk)',bg:'var(--pkb)',
      items:vipC.filter(function(c){return c.tier==='vip'&&c.g>=700;}).sort(function(a,b){return b.g-a.g;}),
      desc:'$1,000 도달시 VVIP'},
    {icon:'&#x1F4FA;',title:'라이브 GMV',color:'var(--pp)',bg:'var(--ppb)',
      items:vipC.filter(function(c){return c.live_gmv>0;}).sort(function(a,b){return b.live_gmv-a.live_gmv;})}
  ];

  var tot = common.concat(celebrate).reduce(function(s, seg) { return s + seg.items.length; }, 0);
  var bdg = $('sBdg'); if (tot > 0) { bdg.textContent = tot; bdg.style.display = 'inline'; } else { bdg.style.display = 'none'; }

  $('segA').innerHTML =
    section('&#x1F6A8; 지금 액션 필요', 'var(--rd)', common) +
    section('&#x1F389; 오늘 축하할 사람 (채널 멘션)', 'var(--gn)', celebrate) +
    section('&#x1F331; New Creator', 'var(--cy)', newSegs) +
    section('&#x1F45F; Active Creator', 'var(--gn)', actSegs) +
    section('&#x2B50; VIP Creator', 'var(--yw)', vipSegs);
}

function renderHist() {
  var dates = Object.keys(hist).sort();
  if (!dates.length) { $('histA').innerHTML = '<div class="sb"><p style="color:var(--dim)">CSV 업로드 후 생성됩니다</p></div>'; return; }
  var allH = new Set();
  dates.forEach(function(d) { Object.keys(hist[d]).forEach(function(h) { if (hist[d][h].g > 0 || hist[d][h].v > 0) allH.add(h); }); });
  var handles = Array.from(allH).filter(function(h) { return C[h]; }).sort(function(a, b) { return (C[b] ? C[b].g : 0) - (C[a] ? C[a].g : 0); });

  var html = '<div class="sb" style="padding:8px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
  html += '<h4 style="color:var(--tx)">&#x1F4C5; 날짜별 GMV + 영상수</h4>';
  html += '</div>';
  html += '<div class="hw"><table class="ht"><thead><tr><th>Handle</th>';
  dates.forEach(function(d) { html += '<th colspan="2" style="text-align:center;border-left:1px solid var(--bd)">' + d.slice(5) + '</th>'; });
  html += '</tr><tr><th></th>';
  dates.forEach(function() { html += '<th style="color:var(--gn)">GMV</th><th style="color:var(--cy);border-right:1px solid var(--bd)">V</th>'; });
  html += '</tr></thead><tbody>';

  handles.forEach(function(handle) {
    var c = C[handle]; var tc = c ? c.tier : 'none';
    var tcol = tc === 'vvip' ? 'var(--pk)' : tc === 'vip' ? 'var(--yw)' : tc === 'active' ? 'var(--gn)' : 'var(--cy)';
    var tierBadge = '<span class="tb t-' + tc + '" style="margin-left:4px;font-size:7px">' + tLabel(tc) + '</span>';
    var row = '<tr><td style="border-left:3px solid ' + tcol + '">';
    row += '<a href="https://www.tiktok.com/@' + handle + '" target="_blank" style="color:var(--ac);text-decoration:none;font-weight:600">@' + handle + '</a>';
    row += tierBadge;
    if (c && c.uname) row += '<br><span style="font-size:8px;color:var(--pp)">' + c.uname + '</span>';
    if (c && c.ag) row += '<span class="ag">AG</span>';
    row += '</td>';
    dates.forEach(function(d, i) {
      var cur = hist[d] && hist[d][handle] ? hist[d][handle] : {g: 0, v: 0};
      var prev = i > 0 && hist[dates[i-1]] && hist[dates[i-1]][handle] ? hist[dates[i-1]][handle] : {g: 0, v: 0};
      var dg = cur.g - prev.g, dv = cur.v - prev.v;
      row += '<td style="border-left:1px solid var(--bd);color:' + (i > 0 && dg > 0 ? 'var(--gn)' : i > 0 && dg < 0 ? 'var(--rd)' : 'inherit') + '">' + fmt(cur.g);
      if (i > 0 && dg !== 0) row += '<br><span style="font-size:8px">' + (dg > 0 ? '+' : '') + fmt(dg) + '</span>';
      row += '</td>';
      row += '<td style="border-right:1px solid var(--bd);min-width:40px">' + cur.v;
      if (i > 0 && dv !== 0) row += '<br><span style="font-size:8px;color:' + (dv > 0 ? 'var(--gn)' : 'var(--rd)') + '"> ' + (dv > 0 ? '+' : '') + dv + '</span>';
      row += '</td>';
    });
    row += '</tr>';
    html += row;
  });
  html += '</tbody></table></div></div>';
  $('histA').innerHTML = html;
}

function renderDisc() {
  var a = Object.values(C);
  var djC = a.filter(function(c) { return c.dj; }).length;
  var chN = a.filter(function(c) { return c.cn; }).length;
  var chA = a.filter(function(c) { return c.ca; }).length;
  var chV = a.filter(function(c) { return c.cv; }).length;
  var html = '<div class="dstat">';
  html += '<div class="dcard"><div class="v" style="color:var(--ac)">' + djC + '</div><div class="l">Discord</div></div>';
  html += '<div class="dcard"><div class="v" style="color:var(--cy)">' + chN + '</div><div class="l">&#x1F331;채널</div></div>';
  html += '<div class="dcard"><div class="v" style="color:var(--gn)">' + chA + '</div><div class="l">&#x1F45F;채널</div></div>';
  html += '<div class="dcard"><div class="v" style="color:var(--yw)">' + chV + '</div><div class="l">&#x2B50;채널</div></div>';
  html += "</div><div class='disc-grid'><div>";
  html += "<div class='dbox'><h4>&#x1F517; Discord &#x2194; TikTok 매핑</h4>";
  html += "<div style='display:flex;gap:4px;margin-bottom:6px'>";
  html += "<input class='si' id='mDN' placeholder='Discord명' style='width:44%;cursor:text'>";

  html += "<button class='btn bp' onclick='addM()' style='padding:5px 8px'>+</button></div>";
  html += "<div id='mL'></div></div>";
  html += "</div><div>";
  html += "<div class='dbox'><h4>&#x1F4E5; 멤버 목록 매칭</h4>";
  html += "<p class='hint'>Discord 멤버 붙여넣기 → 자동 매칭</p>";
  html += "<textarea class='ta' id='dMem' style='height:80px;cursor:text'></textarea>";
  html += "<button class='btn bp' style='margin-top:4px' onclick='mDisc()'>&#x1F50D;</button>";
  html += "<div class='dr' id='dMR'></div></div>";
  html += "</div></div>";
  $('discA').innerHTML = html; rML();
}
function bm(field, val, taId, resId) {
  var text = $(taId).value.trim(); if (!text) return;
  var hs = text.split('\n').map(function(h) { return h.trim().toLowerCase().replace(/^@/, ''); }).filter(Boolean);
  var ok = 0, bad = [];
  hs.forEach(function(h) {
    var target = C[h] ? h : (discMap[h] || null);
    if (target && C[target]) { C[target][field] = val; ok++; } else { bad.push(h); }
  });
  $(resId).innerHTML = '<p class="ok">&#x2705;' + ok + '</p>' + (bad.length ? '<p class="no">&#x274C;' + bad.join(', ') + '</p>' : '');
  render();
}

function addM() {
  var dn = $('mDN').value.trim(), tt = $('mTT').value.trim().toLowerCase().replace(/^@/, '');
  if (!dn || !tt) return;
  // Allow mapping even if not in Euka (for Discord-only members)
  discMap[dn.toLowerCase()] = tt;
  // If in Euka, also mark as Discord joined
  if (C[tt]) { C[tt].dj = true; C[tt].uname = dn.toLowerCase(); }
  $('mDN').value = ''; $('mTT').value = ''; rML(); 
  // Force immediate save (not debounced)
  if (API !== null) {
    fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(buildState())})
      .then(function(r){return r.json()})
      .then(function(d){setSt(new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+' 저장됨');})
      .catch(function(){setSt('실패','var(--rd)')});
  }
  toast(dn + ' → @' + tt + (C[tt] ? ' ✅' : ' (Euka 미참가)'));
}
function delM(k) { 
  delete discMap[k]; rML();
  if (API !== null) {
    fetch('/api/state', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(buildState())})
      .then(function(r){return r.json()})
      .then(function(){setSt('삭제됨')})
      .catch(function(){setSt('실패','var(--rd)')});
  }
}
function rML() {
  var el = $('mL'); if (!el) return;
  var entries = Object.entries(discMap);
  if (!entries.length) { el.innerHTML = '<p style="font-size:10px;color:var(--dim)">-</p>'; return; }
  entries.sort(function(a,b){ return a[0].localeCompare(b[0]); });
  var h = '<div style="max-height:300px;overflow-y:auto;border:1px solid var(--bd);border-radius:5px">';
  h += '<table class="mt" style="width:100%"><thead style="position:sticky;top:0;background:var(--s2)"><tr><th>Discord</th><th>TikTok</th><th></th></tr></thead><tbody>';
  entries.forEach(function(p) {
    h += '<tr><td style="font-size:10px">' + p[0] + '</td><td style="font-size:10px">@' + p[1] + '</td>';
    h += '<td><button class="btn" style="background:var(--rd);color:#fff;padding:1px 4px;font-size:8px" onclick="delM(\'' + p[0].replace(/'/g, "\'") + '\')">x</button></td></tr>';
  });
  h += '</tbody></table></div><p style="font-size:9px;color:var(--dim);margin-top:4px">' + entries.length + '개 매핑</p>';
  el.innerHTML = h;
}

function lev(a, b) {
  var m = a.length, n = b.length, d = [];
  for (var i = 0; i <= m; i++) { d[i] = []; for (var j = 0; j <= n; j++) d[i][j] = 0; d[i][0] = i; }
  for (var j = 0; j <= n; j++) d[0][j] = j;
  for (var i = 1; i <= m; i++) for (var j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));
  return d[m][n];
}

function mDisc() {
  var text = $('dMem').value.trim(); if (!text) return;
  var mems = text.split('\n').map(function(m) { return m.trim(); }).filter(Boolean);
  var ks = Object.keys(C); var exact = [], fuzzy = [], none = [];
  mems.forEach(function(m) {
    var ml = m.toLowerCase().replace(/^@/, '');
    if (C[ml]) { C[ml].dj = true; exact.push(ml); return; }
    if (discMap[ml] && C[discMap[ml]]) { C[discMap[ml]].dj = true; exact.push(ml + '→' + discMap[ml]); return; }
    var cands = ks.filter(function(h) { return (ml.length >= 4 && h.indexOf(ml) >= 0) || (lev(ml, h) <= 2 && ml.length >= 4); });
    if (cands.length) fuzzy.push({d: m, c: cands}); else none.push(m);
  });
  var h = '<p style="font-weight:600;font-size:10px">' + exact.length + '/' + mems.length + '</p>';
  if (fuzzy.length) {
    h += '<details open><summary style="cursor:pointer;color:var(--yw);font-size:10px">&#x1F7E1;후보(' + fuzzy.length + ')</summary>';
    fuzzy.forEach(function(e) {
      h += '<div class="fy">' + e.d + ' ';
      e.c.forEach(function(c) { h += '<button class="btn bp" style="padding:1px 4px;font-size:8px" onclick="cfm(\'' + e.d.replace(/'/g, "\\'") + '\',\'' + c + '\')">@' + c + '</button> '; });
      h += '</div>';
    });
    h += '</details>';
  }
  $('dMR').innerHTML = h; render();
}
function cfm(dn, tt) { discMap[dn.toLowerCase()] = tt; if (C[tt]) C[tt].dj = true; rML(); mDisc(); }

function init() {
  RAW_P.forEach(function(r) {
    var h = r[0], g = r[1], v = r[2], w = r[3], lp = r[4];
    var sv = SAVED_TRACKING[h] || {};
    var dci = DC_INFO[h] || {}; var ct = CONTACTS[h] || {};
    var sb = SUBS_DATA[h] || {vg: 0, vc: 0, lg: 0, lc: 0};
    var t = sv.tier || tier(g, v);
    C[h] = {h: h, g: g, v: v, w: w,
      dj: sv.dj !== undefined ? sv.dj : dcSet.has(h),
      ct: sv.ct || false, rp: sv.rp || false, nt: sv.nt || '', ag: agSet.has(h),
      cn: sv.cn || false, ca: sv.ca || false, cv: sv.cv || false,
      uname: sv.uname || dci.u || '', email: sv.email || ct.em || '',
      phone: sv.phone || ct.ph || '', prevTier: sv.prevTier || '', tier: t,
      video_gmv: sb.vg || 0, video_count: sb.vc || 0, live_gmv: sb.lg || 0, live_count: sb.lc || 0};
  });
  // Apply latest hist GMV
  var dates = Object.keys(hist).sort(); var latest = dates[dates.length - 1];
  if (latest && hist[latest]) {
    Object.keys(hist[latest]).forEach(function(h) {
      if (C[h] && hist[latest][h]) { C[h].g = hist[latest][h].g; C[h].v = hist[latest][h].v; C[h].tier = tier(C[h].g, C[h].v); }
    });
  }
  Object.values(C).forEach(function(c) { c.ag = agSet.has(c.h); });
  if (API !== null) {
    setSt('연결중...', 'var(--yw)');
    fetch('/api/state')
      .then(function(r) { return r.json(); })
      .then(function(st) { applyState(st); render(); setSt('서버 연결됨'); })
      .catch(function() { render(); setSt('로컬 모드', 'var(--dim)'); });
  } else { render(); }
}
init();
